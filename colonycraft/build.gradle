plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// The Market mod (built from the repo root first): its bank pays wages and buys what the storehouses auto-sell.
	implementation fileTree(dir: '../build/libs', include: 'market-*.jar', exclude: '*-sources.jar')
	// Optional mods it works with, only on the smoke test's server (CI builds them first; locally they're there if you
	// built them, and Colonycraft runs without them too). Nothing of theirs ends up in the Colonycraft jar.
	runtimeOnly fileTree(dir: '../warehouse/build/libs', include: 'warehouse-*.jar', exclude: '*-sources.jar')
	runtimeOnly fileTree(dir: '../havana/build/libs', include: 'havana-*.jar', exclude: '*-sources.jar')
	runtimeOnly fileTree(dir: '../burlap-sack/build/libs', include: 'burlap-sack-*.jar', exclude: '*-sources.jar')
	runtimeOnly fileTree(dir: '../riches/build/libs', include: 'riches-*.jar', exclude: '*-sources.jar')
	runtimeOnly fileTree(dir: '../fossil-fool/build/libs', include: 'fossil-fool-*.jar', exclude: '*-sources.jar')
}

loom {
	runs {
		// Boots a real dedicated server with the mod, runs Colonycraft's self-checks, then shuts down.
		smoke {
			server()
			name = "Colonycraft Smoke Test"
			vmArg "-Dcolonycraft.smokeTest=true"
			programArg "nogui"
			runDir = "run/smoke"
		}
	}
}

processResources {
	inputs.property "version", project.mod_version
	inputs.property "minecraft_version", project.minecraft_version
	inputs.property "loader_version", project.loader_version

	filesMatching("fabric.mod.json") {
		expand "version": project.mod_version,
			"minecraft_version": project.minecraft_version,
			"loader_version": project.loader_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
