name: Hooghe Heeren

on:
  push:
    paths:
      - 'hooghe-heeren/**'
      - 'compagnie/**'
      - 'src/**'
      - '.github/workflows/hooghe-heeren.yml'
  pull_request:
    paths:
      - 'hooghe-heeren/**'
      - 'compagnie/**'
      - 'src/**'
      - '.github/workflows/hooghe-heeren.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: hooghe-heeren

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the Market mod (treasuries are in Marks)
        working-directory: .
        run: ./gradlew build

      - name: Build De Compagnie (the rivals live behind a tab on its desk)
        working-directory: compagnie
        run: ./gradlew build

      - name: Build
        run: |
          set -o pipefail
          ./gradlew build 2>&1 | tee build.log

      - name: Smoke test (boot a server, run a court of rivals with diplomacy, errands, war, a seat, a garrison, a guest, save and load)
        run: |
          mkdir -p run/smoke
          echo "eula=true" > run/smoke/eula.txt
          timeout 900 ./gradlew runSmoke --stacktrace 2>&1 | tee smoke.log || true
          grep -E "\[smoke\]|Hooghe Heeren" smoke.log || true
          if grep -q "Serialization errors" smoke.log; then
            echo "::error::Vanilla rejected some entity data"
            grep -A1 "Serialization errors" smoke.log | head -20
            exit 1
          fi
          if grep -q "HOOGHE HEEREN SMOKE TEST PASSED" smoke.log; then
            echo "Smoke test passed"
          else
            echo "::error::Smoke test did not pass"
            grep -nE "ERROR|Exception|FAILED|Caused by|Mixin|Smoke check" smoke.log | head -80 || true
            exit 1
          fi

      - name: API dump (diagnostics on failure)
        if: failure()
        run: bash scripts/api-dump.sh || true

      - name: Compile errors (summary)
        if: failure()
        run: |
          grep -A4 -E "error:" build.log | head -300 || true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: hooghe-heeren-mod
          path: |
            hooghe-heeren/build/libs/*.jar
            compagnie/build/libs/*.jar
            build/libs/market-*.jar
            !**/*-sources.jar

      # De Hooghe Heeren needs De Compagnie and the Market mod, so the release carries all three jars.
      - name: Publish jars to the "compagnie-latest" release
        if: success() && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hooghe-heeren-latest
          name: Hooghe Heeren (latest build)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            Latest green build of De Hooghe Heeren for Minecraft 26.3 (Fabric, server-side), plus the matching De Compagnie and Market mods it needs.
            Put all three jars in your server's mods/ folder together with Fabric API (replace your old market and compagnie jars).
            Built from ${{ github.sha }}.
          files: |
            hooghe-heeren/build/libs/hooghe-heeren-*.jar
            compagnie/build/libs/compagnie-*.jar
            build/libs/market-*.jar
            !**/*-sources.jar
