name: Mobile Home

on:
  push:
    paths:
      - 'mobile-home/**'
      - '.github/workflows/mobile-home.yml'
  pull_request:
    paths:
      - 'mobile-home/**'
      - '.github/workflows/mobile-home.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: mobile-home

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          set -o pipefail
          ./gradlew build 2>&1 | tee build.log

      - name: Smoke test (boot a dedicated server, drive a van and a tank)
        run: |
          mkdir -p run/smoke
          echo "eula=true" > run/smoke/eula.txt
          timeout 900 ./gradlew runSmoke --stacktrace 2>&1 | tee smoke.log || true
          grep -E "\[smoke\]|Mobile Home" smoke.log || true
          if grep -q "Serialization errors" smoke.log; then
            echo "::error::Vanilla rejected some entity data"
            grep -A1 "Serialization errors" smoke.log | head -20
            exit 1
          fi
          if grep -q "MOBILE HOME SMOKE TEST PASSED" smoke.log; then
            echo "Smoke test passed"
          else
            echo "::error::Smoke test did not pass"
            grep -nE "ERROR|Exception|FAILED|Caused by|Mixin|Smoke check" smoke.log | head -80 || true
            exit 1
          fi

      - name: API dump (diagnostics on failure)
        if: failure()
        run: bash scripts/api-dump.sh || true

      - name: Compile errors (summary)
        if: failure()
        run: |
          grep -A4 -E "error:" build.log | head -300 || true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mobile-home-mod
          path: |
            mobile-home/build/libs/*.jar
            !mobile-home/build/libs/*-sources.jar
