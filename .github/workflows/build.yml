name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve Fabric versions
        run: bash scripts/resolve-versions.sh

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Smoke test (boot a dedicated server with the mod)
        run: |
          mkdir -p run/smoke
          echo "eula=true" > run/smoke/eula.txt
          timeout 900 ./gradlew runSmoke --stacktrace 2>&1 | tee smoke.log || true
          if grep -q "MARKET SMOKE TEST PASSED" smoke.log; then
            echo "Smoke test passed"
          else
            echo "::error::Smoke test did not pass"
            grep -nE "ERROR|Exception|FAILED|Caused by|Mixin" smoke.log | head -80 || true
            exit 1
          fi

      - name: API dump (diagnostics)
        if: always()
        run: bash scripts/api-dump.sh || true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: market-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
