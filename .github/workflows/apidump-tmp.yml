name: ApiDumpTmp
on:
  push:
    paths: ['scripts/api-dump-sleep.sh', '.github/workflows/apidump-tmp.yml']
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 25}
      - uses: gradle/actions/setup-gradle@v4
      - run: cd cannon && ./gradlew build -x test
      - run: bash scripts/api-dump-sleep.sh
