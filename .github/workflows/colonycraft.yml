name: Colonycraft

on:
  push:
    paths:
      - 'colonycraft/**'
      - 'src/**'
      - 'warehouse/**'
      - 'havana/**'
      - 'burlap-sack/**'
      - '.github/workflows/colonycraft.yml'
  pull_request:
    paths:
      - 'colonycraft/**'
      - 'src/**'
      - 'warehouse/**'
      - 'havana/**'
      - 'burlap-sack/**'
      - '.github/workflows/colonycraft.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: colonycraft

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the Market mod (Colonycraft uses its bank)
        working-directory: .
        run: ./gradlew build

      - name: Build Warehouse, Havana and Burlap Sack (the smoke test runs Colonycraft with them too)
        working-directory: .
        run: |
          (cd cannon && ./gradlew build -x test)
          (cd ahoy && ./gradlew build -x test)
          (cd cargo-train && ./gradlew build -x test)
          (cd fossil-fool && ./gradlew build -x test)
          (cd warehouse && ./gradlew build -x test)
          (cd havana && ./gradlew build -x test)
          (cd burlap-sack && ./gradlew build -x test)

      - name: Build
        run: |
          set -o pipefail
          ./gradlew build 2>&1 | tee build.log

      - name: Smoke test (boot a dedicated server, found a colony, run paydays)
        run: |
          mkdir -p run/smoke
          echo "eula=true" > run/smoke/eula.txt
          timeout 900 ./gradlew runSmoke --stacktrace 2>&1 | tee smoke.log || true
          grep -E "\[smoke\]|Colonycraft" smoke.log || true
          if grep -q "Serialization errors" smoke.log; then
            echo "::error::Vanilla rejected some entity data"
            grep -A1 "Serialization errors" smoke.log | head -20
            exit 1
          fi
          if grep -q "COLONYCRAFT SMOKE TEST PASSED" smoke.log; then
            echo "Smoke test passed"
          else
            echo "::error::Smoke test did not pass"
            grep -nE "ERROR|Exception|FAILED|Caused by|Mixin|Smoke check" smoke.log | head -80 || true
            exit 1
          fi

      - name: Compile errors (summary)
        if: failure()
        run: |
          grep -A4 -E "error:" build.log | head -300 || true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: colonycraft-mod
          path: |
            colonycraft/build/libs/*.jar
            build/libs/market-*.jar
            !**/*-sources.jar

      # Colonycraft needs the Market mod, so the release carries both jars.
      - name: Publish jars to the "colonycraft-latest" release
        if: success() && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: colonycraft-latest
          name: Colonycraft (latest build)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            Latest green build of Colonycraft for Minecraft 26.3 (Fabric, server-side), plus the matching Market mod it needs.
            Put both jars in your server's mods/ folder together with Fabric API (replace your old market jar).
            Built from ${{ github.sha }}.
          files: |
            colonycraft/build/libs/colonycraft-*.jar
            build/libs/market-*.jar
            !**/*-sources.jar
