name: LIB Pack

# Every mod is in the pack, so any change anywhere rebuilds it.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # Market first: Colonycraft compiles against its jar. Ahoy, Cargo Train and Fossil Fool before Warehouse, which docks ships, unloads trains and takes drill rig cargo.
      - name: Build all eighteen mods
        run: |
          set -o pipefail
          for dir in . cannon ahoy burlap-sack cargo-train colonycraft flintlock havana mobile-home fossil-fool warehouse skills hamlets overenchant fuck-illagers riches blimey sellswords; do
            echo "::group::Build $dir"
            (cd "$dir" && ./gradlew build -x test) 2>&1 | tee -a build.log
            echo "::endgroup::"
          done

      - name: Build the pack
        working-directory: lib-pack
        run: ./gradlew build

      - name: Install the pack on a real Fabric server and boot it
        working-directory: lib-pack
        run: |
          set -euo pipefail
          prop() { grep "^$1=" gradle.properties | cut -d= -f2; }
          MC=$(prop minecraft_version)
          LOADER=$(prop loader_version)
          FAPI=$(prop fabric_api_version)
          INSTALLER=$(curl -fsSL https://meta.fabricmc.net/v2/versions/installer | jq -r '.[0].version')

          # Exactly what a server owner does: launcher + Fabric API + the pack in mods/.
          mkdir -p server/mods
          curl -fsSL -o server/fabric-server.jar "https://meta.fabricmc.net/v2/versions/loader/$MC/$LOADER/$INSTALLER/server/jar"
          curl -fsSL -o server/mods/fabric-api.jar "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/$FAPI/fabric-api-$FAPI.jar"
          cp build/libs/lib-pack-*.jar server/mods/
          ls -l server/mods

          cd server
          echo "eula=true" > eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\n' > server.properties

          # Boot, wait for "Done", then type "stop" into the console.
          mkfifo console
          java -Xmx2G -jar fabric-server.jar nogui < console > server.log 2>&1 &
          PID=$!
          exec 3> console
          for i in $(seq 1 600); do
            grep -q "Done (" server.log && break
            kill -0 "$PID" 2>/dev/null || break
            sleep 1
          done
          sleep 10
          echo stop >&3 || true
          for i in $(seq 1 120); do kill -0 "$PID" 2>/dev/null || break; sleep 1; done
          kill "$PID" 2>/dev/null || true
          exec 3>&-

          grep "Loading .* mods:" server.log || true
          grep -E "(- |-- )(libpack|market|ahoy|burlapsack|cannon|cargotrain|colonycraft|flintlock|havana|mobilehome|warehouse|skills|hamlets|overenchant|fuckillagers|fossilfool|riches|blimey|sellswords) [0-9]" server.log || true

          failed=0
          if ! grep -q "Done (" server.log; then
            echo "::error::The server didn't finish starting with the pack installed"
            failed=1
          fi
          # Fabric lists nested mods under their parent: "|-- market 1.0.0+mc26.3".
          for id in libpack market ahoy burlapsack cannon cargotrain colonycraft flintlock havana mobilehome warehouse skills hamlets overenchant fuckillagers fossilfool riches blimey sellswords; do
            if ! grep -qE "(- |-- )$id [0-9]" server.log; then
              echo "::error::Mod '$id' wasn't loaded from the pack"
              failed=1
            fi
          done
          if grep -nE "at com\.thatcoffeelock\.|Mixin apply failed|Incompatible mods" server.log; then
            echo "::error::Errors from the bundled mods while booting"
            failed=1
          fi
          if [ "$failed" = 1 ]; then
            grep -nE "ERROR|Exception|Caused by|Incompatible|requires" server.log | head -80 || true
            exit 1
          fi
          echo "LIB PACK BOOT TEST PASSED"

      - name: Server log (on failure)
        if: failure()
        working-directory: lib-pack
        run: tail -200 server/server.log || true

      - name: Compile errors (summary)
        if: failure()
        run: |
          grep -A4 -E "error:" build.log | head -300 || true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: lib-pack
          path: lib-pack/build/libs/lib-pack-*.jar

      # A plain download link (no zip, no GitHub login needed on a public repo):
      # the Releases page always has the jar from the latest green build.
      - name: Publish jar to the "lib-pack-latest" release
        if: success() && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lib-pack-latest
          name: LIB Pack (latest build)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            Latest green build of the LIB Pack: all seventeen mods (Market, Colonycraft, Ahoy, Burlap Sack, Cannon, Cargo Train, Flintlock, Havana, Mobile Home, Warehouse, Skills, Hamlets & Horrors, Overenchant, Fuck Illagers, Fossil Fool, Riches, Blimey) in one jar, for Minecraft 26.3 (Fabric, server-side).
            Download the .jar below and put it in your server's mods/ folder together with Fabric API. Remove the separate mod jars if you had them.
            Built from ${{ github.sha }}.
          files: lib-pack/build/libs/lib-pack-*.jar
