name: Ahoy

on:
  push:
    paths:
      - 'ahoy/**'
      - '.github/workflows/ahoy.yml'
  pull_request:
    paths:
      - 'ahoy/**'
      - '.github/workflows/ahoy.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: ahoy

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          set -o pipefail
          ./gradlew build 2>&1 | tee build.log

      - name: Smoke test (boot a dedicated server, launch, sail and anchor a ship)
        run: |
          mkdir -p run/smoke
          echo "eula=true" > run/smoke/eula.txt
          timeout 900 ./gradlew runSmoke --stacktrace 2>&1 | tee smoke.log || true
          grep -E "\[smoke\]|Ahoy" smoke.log || true
          if grep -q "Serialization errors" smoke.log; then
            echo "::error::Vanilla rejected some entity data"
            grep -A1 "Serialization errors" smoke.log | head -20
            exit 1
          fi
          if grep -q "AHOY SMOKE TEST PASSED" smoke.log; then
            echo "Smoke test passed"
          else
            echo "::error::Smoke test did not pass"
            grep -nE "ERROR|Exception|FAILED|Caused by|Mixin|Smoke check" smoke.log | head -80 || true
            exit 1
          fi

      - name: API dump (diagnostics on failure)
        if: failure()
        run: bash scripts/api-dump.sh || true

      - name: Compile errors (summary)
        if: failure()
        run: |
          grep -A4 -E "error:" build.log | head -300 || true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ahoy-mod
          path: |
            ahoy/build/libs/*.jar
            !ahoy/build/libs/*-sources.jar

      # A plain download link (no zip, no GitHub login needed on a public repo):
      # the Releases page always has the jar from the latest green build.
      - name: Publish jar to the "ahoy-latest" release
        if: success() && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ahoy-latest
          name: Ahoy (latest build)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            Latest green build of Ahoy (ships!) for Minecraft 26.3 (Fabric, server-side).
            Download the .jar below and put it in your server's mods/ folder together with Fabric API.
            Built from ${{ github.sha }}.
          files: |
            ahoy/build/libs/ahoy-*.jar
            !ahoy/build/libs/*-sources.jar
