name: Sellswords

on:
  push:
    paths:
      - 'sellswords/**'
      - 'src/**'
      - '.github/workflows/sellswords.yml'
  pull_request:
    paths:
      - 'sellswords/**'
      - 'src/**'
      - '.github/workflows/sellswords.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: sellswords

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the Market mod (mercenaries are hired for Marks)
        working-directory: .
        run: ./gradlew build

      - name: Build
        run: |
          set -o pipefail
          ./gradlew build 2>&1 | tee build.log

      - name: Smoke test (boot a server, hire a squad, shoot a husk, promote both paths, the horn, death, save and load)
        run: |
          mkdir -p run/smoke
          echo "eula=true" > run/smoke/eula.txt
          timeout 900 ./gradlew runSmoke --stacktrace 2>&1 | tee smoke.log || true
          grep -E "\[smoke\]|Sellswords" smoke.log || true
          if grep -q "Serialization errors" smoke.log; then
            echo "::error::Vanilla rejected some entity data"
            grep -A1 "Serialization errors" smoke.log | head -20
            exit 1
          fi
          if grep -q "SELLSWORDS SMOKE TEST PASSED" smoke.log; then
            echo "Smoke test passed"
          else
            echo "::error::Smoke test did not pass"
            grep -nE "ERROR|Exception|FAILED|Caused by|Mixin|Smoke check" smoke.log | head -80 || true
            exit 1
          fi

      - name: API dump (diagnostics on failure)
        if: failure()
        run: bash scripts/api-dump.sh || true

      - name: Compile errors (summary)
        if: failure()
        run: |
          grep -A4 -E "error:" build.log | head -300 || true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sellswords-mod
          path: |
            sellswords/build/libs/*.jar
            build/libs/market-*.jar
            !**/*-sources.jar

      # Sellswords needs the Market mod, so the release carries both jars.
      - name: Publish jars to the "sellswords-latest" release
        if: success() && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sellswords-latest
          name: Sellswords (latest build)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            Latest green build of Sellswords for Minecraft 26.3 (Fabric, server-side), plus the matching Market mod it needs.
            Put both jars in your server's mods/ folder together with Fabric API (replace your old market jar).
            Built from ${{ github.sha }}.
          files: |
            sellswords/build/libs/sellswords-*.jar
            build/libs/market-*.jar
            !**/*-sources.jar
