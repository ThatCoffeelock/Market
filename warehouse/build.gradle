plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Ahoy and Cargo Train (built in their own folders first): ships unload at a Loading Dock, trains at a Drop-off Station.
	// Both are optional at runtime; Warehouse only talks to them when they're installed.
	implementation fileTree(dir: '../ahoy/build/libs', include: 'ahoy-*.jar', exclude: '*-sources.jar')
	implementation fileTree(dir: '../cargo-train/build/libs', include: 'cargo-train-*.jar', exclude: '*-sources.jar')
}

loom {
	runs {
		// Boots a real dedicated server with the mod, runs Warehouse's self-checks, then shuts down.
		smoke {
			server()
			name = "Warehouse Smoke Test"
			vmArg "-Dwarehouse.smokeTest=true"
			programArg "nogui"
			runDir = "run/smoke"
		}
	}
}

processResources {
	inputs.property "version", project.mod_version
	inputs.property "minecraft_version", project.minecraft_version
	inputs.property "loader_version", project.loader_version

	filesMatching("fabric.mod.json") {
		expand "version": project.mod_version,
			"minecraft_version": project.minecraft_version,
			"loader_version": project.loader_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
